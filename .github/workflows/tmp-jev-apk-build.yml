name: Temporary Jev PR4 APK build

on:
  push:
    branches:
      - tmp-jev-apk-build-20260922

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Jev PR branch
        uses: actions/checkout@v4
        with:
          repository: ULing19/jev-chat-JARVIS
          ref: feat/custom-api-provider
          path: jev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager not found; relying on preinstalled Android SDK"
          fi

      - name: Build debug APK
        working-directory: jev
        shell: bash
        env:
          JEV_KEYSTORE_PROPS: /tmp/jev-release.properties
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../jev-pr4-openai-compatible-debug.apk

      - name: Checksum
        shell: bash
        run: sha256sum jev-pr4-openai-compatible-debug.apk | tee jev-pr4-openai-compatible-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-pr4-openai-compatible-debug
          path: |
            jev-pr4-openai-compatible-debug.apk
            jev-pr4-openai-compatible-debug.apk.sha256
          if-no-files-found: error
          retention-days: 1
