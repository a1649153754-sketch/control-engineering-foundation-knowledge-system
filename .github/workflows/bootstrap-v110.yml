name: Bootstrap v1.1.0

on:
  push:
    branches: [v1.1.0-final]
    paths:
      - ".bootstrap-v110-clean/**"
      - ".github/workflows/bootstrap-v110.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-v110-clean/chunk-* > /tmp/v110.b64
          base64 --decode /tmp/v110.b64 > /tmp/v110.patch.xz
          echo "019f07a756759221327cd771c89f8fe9a0b38f717b3f1c737e6cee7616bdaffe  /tmp/v110.patch.xz" | sha256sum --check --strict
          xz -dc /tmp/v110.patch.xz > /tmp/v110.patch

      - name: Apply and validate v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=nowarn /tmp/v110.patch
          python3 scripts/build_bundle.py
          python3 scripts/validate_project.py

      - name: Commit project update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish control engineering foundation knowledge system v1.1.0"
          git push origin HEAD:v1.1.0-final
